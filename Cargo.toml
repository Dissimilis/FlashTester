[package]
name = "flashtester"
version = "0.4.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(any(windows, target_os = "linux", target_os = "freebsd"))'.dependencies]
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui_plot = "0.37.0"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Power", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Usb", "Win32_Devices_Properties", "Win32_Security", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = { version = "0.13.2", features = ["randr"] }
xkeysym = "0.2.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
